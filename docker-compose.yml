# ============================================================
# EXCAVA.OPS / TRIRARA - Compose GABUNGAN untuk Coolify v4 (>= 4.3.14)
# Service: mariadb (database utama) + backend + frontend
#          + mongo (LAMA, hanya untuk migrasi data sekali jalan — lihat DEPLOY_COOLIFY.md)
# ------------------------------------------------------------
# Domain (atur di Coolify, per service):
#   - frontend  -> https://sistem.domainanda.com      (port 80)
#   - backend   -> https://api.sistem.domainanda.com   (port 8000)
#   - mariadb   -> TANPA domain (internal saja)
#   - mongo     -> TANPA domain (internal, dihapus setelah migrasi)
# Env wajib di Coolify: MARIADB_ROOT_PASSWORD, MARIADB_PASSWORD, ADMIN_PASSWORD, CORS_ORIGINS
# ============================================================

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-allowed-packet=64M"]
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-ubah_password_root_ini}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-trirara}
      - MARIADB_USER=${MARIADB_USER:-trirara}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-ubah_password_ini}
    volumes:
      # Data persisten — JANGAN hapus volume ini.
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---- LAMA: MongoDB hanya dipakai sebagai SUMBER migrasi (dibaca saja). ----
  # Nama volume "mongo_data" SENGAJA sama dengan versi lama agar data lama terbaca.
  # Setelah migrasi terverifikasi (Bantuan & Backup -> "Migrasi MongoDB -> MariaDB selesai"),
  # hapus service ini + variabel MIGRATE_FROM_* di backend (lihat DEPLOY_COOLIFY.md).
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-ubah_password_ini}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # MariaDB internal via nama service "mariadb"
      - MARIADB_HOST=mariadb
      - MARIADB_PORT=3306
      - MARIADB_DATABASE=${MARIADB_DATABASE:-trirara}
      - MARIADB_USER=${MARIADB_USER:-trirara}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-ubah_password_ini}
      # Migrasi otomatis SEKALI dari MongoDB lama (mode merge, Mongo hanya dibaca). Hapus 2 baris ini setelah migrasi.
      - MIGRATE_FROM_MONGO_URL=mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-ubah_password_ini}@mongo:27017/?authSource=admin
      - MIGRATE_FROM_MONGO_DB=${DB_NAME:-ttp_ops}
      # WAJIB = origin frontend PERSIS (bukan *), karena login pakai cookie berkredensial
      - CORS_ORIGINS=${CORS_ORIGINS:-https://sistem.domainanda.com}
      # Admin pertama dibuat otomatis saat DB kosong (dan belum ada data dari migrasi) — GANTI password!
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_NAME=${ADMIN_NAME:-Administrator}
    depends_on:
      mariadb:
        condition: service_healthy
      mongo:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Frontend memakai frontend/.env.production (REACT_APP_BACKEND_URL) yang di-bake saat build.
    # Pastikan .env.production berisi subdomain backend Anda (tanpa /api).
    expose:
      - "80"

volumes:
  mariadb_data:
  mongo_data:
